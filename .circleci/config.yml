version: 2.1

orbs:
  node: circleci/node@7.2.1

executors:
  macos:
    macos:
      xcode: "26.4.1"
    resource_class: m4pro.medium
    environment:
      CI: "true"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

commands:
  prepare:
    parameters:
      node-version:
        type: string
    steps:
      - checkout:
          method: full
      - node/install:
          node-version: << parameters.node-version >>
      - run:
          name: Verify runtime and prepare npm cache
          command: |
            node --version
            test "$(uname -m)" = arm64
            echo 'export NPM_CONFIG_CACHE="$HOME/.npm"' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - npm-macos-arm64-node-<< parameters.node-version >>-v1-{{ checksum "package-lock.json" }}

jobs:
  secrets:
    executor: macos
    steps:
      - prepare:
          node-version: "22.23.4"
      - run:
          name: Scan Git candidates and full history with redacted findings
          no_output_timeout: 10m
          command: node ci/check-secrets.mjs --bootstrap
      - store_artifacts:
          path: ci-results/secrets
          destination: secret-scan

  core:
    executor: macos
    parameters:
      node-version:
        type: string
    steps:
      - prepare:
          node-version: << parameters.node-version >>
      - run:
          name: Ordinary tests, no Orca or model account required
          no_output_timeout: 15m
          command: node ci/run-ci.mjs --suite core --node-version '<< parameters.node-version >>'
      - save_cache:
          key: npm-macos-arm64-node-<< parameters.node-version >>-v1-{{ checksum "package-lock.json" }}
          paths: [~/.npm]
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: ci-results
          destination: core-<< parameters.node-version >>

  orca-live:
    executor: macos
    steps:
      - prepare:
          node-version: "22.23.4"
      - run:
          name: Ensure functional tmux on the disposable VM
          command: node ci/ensure-tmux.mjs --install
      - run:
          name: Pinned Orca, plugin, first-run installer and example topology lifecycle
          no_output_timeout: 20m
          command: node ci/run-ci.mjs --suite orca --node-version 22.23.4
      - save_cache:
          key: npm-macos-arm64-node-22.23.4-v1-{{ checksum "package-lock.json" }}
          paths: [~/.npm]
      - store_test_results:
          path: test-reports
      - store_artifacts:
          path: ci-results
          destination: orca-live

workflows:
  macos-validation:
    # Same GitHub App only-build-prs preset as dsh-session-cleanup.
    # Fork exclusion must also be configured in the GitHub App trigger, not inferred here.
    when: >-
      pipeline.event.name == "api" or
      (pipeline.event.name == "push" and pipeline.event.github.ref == "refs/heads/main") or
      (pipeline.event.name == "pull_request" and
      (pipeline.event.action == "opened" or pipeline.event.action == "synchronize" or pipeline.event.action == "reopened"))
    jobs:
      - secrets:
          name: macos-secret-scan
      - core:
          name: macos-core-node22
          node-version: "22.23.4"
          requires: [macos-secret-scan]
      - core:
          name: macos-core-node24
          node-version: "24.22.1"
          requires: [macos-secret-scan]
      - orca-live:
          name: macos-orca-live-node22
          requires: [macos-secret-scan]
