name: Intel Mac CI
# Public entry point; dispatches and supervises the Intel Mac CI helper workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch and supervise Intel Mac CI helper
    runs-on: ubuntu-latest
    timeout-minutes: 38
    permissions:
      contents: read
      actions: write # Dispatch/cancel only the separate worker run; no runner-admin secret.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
      - name: Dispatch Intel tests and bound queue/execution time
        timeout-minutes: 34
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/intel/github-dispatch.mjs
      - name: Cancel a still-pending worker after failure or interruption
        if: always()
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ci/intel/github-dispatch.mjs --cleanup
      - name: Preserve controller result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intel-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-results/intel-dispatch/
          if-no-files-found: warn
          retention-days: 14
