name: Intel Mac worker
run-name: Intel Mac worker ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Correlation ID supplied by the Intel experiment controller
        required: true
        type: string
      source_sha:
        description: Exact reviewed source commit supplied by the controller
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Intel Mac lab tests
    runs-on: [self-hosted, macOS, X64, intel-mac-lab]
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Verify Intel Mac environment
        shell: bash
        run: |
          set -euo pipefail
          sw_vers
          uname -m
          test "$(uname -m)" = "x86_64"
          sysctl -n machdep.cpu.brand_string
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          clean: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.4"
          architecture: x64
      - name: Verify exact source and native Node
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          node -e 'if (process.platform !== "darwin" || process.arch !== "x64" || process.version !== "v22.23.4") process.exit(1)'
      - name: Run full additive Intel validation
        shell: bash
        run: node ci/intel/run-ci.mjs --suite orca --node-version 22.23.4 --output ci-results/intel-github
      - name: Preserve allowlisted Intel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intel-mac-lab-${{ github.run_id }}
          path: |
            ci-results/intel-github/
            test-reports/intel-*.xml
          if-no-files-found: warn
          retention-days: 14
